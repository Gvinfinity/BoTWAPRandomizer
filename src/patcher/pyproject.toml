[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "botw-ap-patcher"
version = "0.2.0"
description = "Static World Patcher for BotW Archipelago"
dependencies = [
    "oead>=1.3.0,<2",
    "rstb>=1.2.2,<2"
]

[project.optional-dependencies]
test = ["pytest>=8"]
